<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymTracker Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Dynamic Content will be injected here -->
        <header class="top-bar">
            <h1 id="page-title" data-i18n="dashboard">Dashboard</h1>
            <div id="header-actions">
                <select id="lang-switcher" onchange="setLanguage(this.value)"
                    style="background:transparent; border:1px solid var(--border); color:var(--text-main); font-size:0.9rem; padding: 4px; border-radius: 4px;">
                    <option value="en">EN</option>
                    <option value="uk">UA</option>
                    <option value="pl">PL</option>
                </select>
            </div>
        </header>

        <main id="main-content" class="content-area">
            <!-- Sheets / Pages go here -->
            <div id="dashboard-view" class="view active">


                <div class="section-header">
                    <h3 data-i18n="quick_actions">Quick Actions</h3>
                </div>
                <div class="card-grid">
                    <button class="action-card primary" onclick="app.startWorkout()">
                        <div class="icon">+</div>
                        <span data-i18n="new_workout">New Workout</span>
                    </button>
                    <button class="action-card" onclick="app.startFreeTraining()">
                        <div class="icon">🏃</div>
                        <span data-i18n="free_training">Free Training</span>
                    </button>
                </div>

                <div class="section-header">
                    <h3 data-i18n="recent_history">Recent History</h3>
                </div>
                <div id="recent-history-list" class="list-container">
                    <!-- JS populated -->
                    <div class="empty-state" data-i18n="no_recent_workouts">No recent workouts</div>
                </div>
            </div>

            <!-- Other views will be hidden by default -->
            <div id="workout-view" class="view hidden"></div>
            <div id="exercises-view" class="view hidden"></div>
            <div id="plans-view" class="view hidden"></div>
            <div id="reports-view" class="view hidden"></div>
        </main>

        <div id="toast-container"></div>
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="app.navigate('dashboard')">
                <span class="icon">🏠</span>
                <span class="label" data-i18n="nav.home">Home</span>
            </button>
            <button class="nav-item" onclick="app.navigate('plans')">
                <span class="icon">📋</span>
                <span class="label" data-i18n="nav.plans">Plans</span>
            </button>
            <button class="nav-item" onclick="app.navigate('exercises')">
                <span class="icon">💪</span>
                <span class="label" data-i18n="nav.exercises">Exercises</span>
            </button>
            <button class="nav-item" onclick="app.navigate('reports')">
                <span class="icon">📊</span>
                <span class="label" data-i18n="nav.reports">Reports</span>
            </button>
        </nav>
    </div>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
    <script>
        // Init Lang Switcher
        document.getElementById('lang-switcher').value = currentLang;
        updateStaticContent();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>

</html>
